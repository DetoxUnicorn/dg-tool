<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1e293b">
  <title>DG Segregation Tool</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    h1 { font-size: 1.25rem; margin: 0 0 12px 0; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: #94a3b8; display: block; margin-bottom: 6px; }
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; margin-bottom: 12px; }
    button { background: #0284c7; border: none; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:active { background: #0369a1; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
    .badge-class { background: #e11d48; color: #fff; }
    .badge-sub { background: #d97706; color: #fff; margin-left: 4px; }
    .result-box { background: #0f172a; border-radius: 8px; padding: 12px; margin-top: 8px; border-left: 4px solid #38bdf8; }
    .rule-item { padding: 10px 0; border-bottom: 1px solid #334155; font-size: 0.9rem; }
    .rule-item:last-child { border-bottom: none; }
    .tag-prohibited { color: #f87171; font-weight: bold; }
    .tag-allowed { color: #4ade80; font-weight: bold; }
    .tag-sep { color: #fbbf24; font-weight: bold; }
    .quick-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
    .chip { background: #334155; padding: 6px 12px; border-radius: 16px; font-size: 0.8rem; white-space: nowrap; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📦 DG Segregation Lookup</h1>
    <label for="unInput">Search UN Number or Name</label>
    <div class="quick-list">
      <span class="chip" onclick="quickFill('1203')">UN 1203 (Petrol)</span>
      <span class="chip" onclick="quickFill('1830')">UN 1830 (Sulphuric)</span>
      <span class="chip" onclick="quickFill('1950')">UN 1950 (Aerosols)</span>
      <span class="chip" onclick="quickFill('1005')">UN 1005 (Ammonia)</span>
    </div>
    <input type="text" id="unInput" placeholder="Enter UN number (e.g. 1830, 1203)..." inputmode="numeric">
    <button onclick="lookupDG()">Check Segregation</button>
  </div>

  <div id="output" style="display:none;">
    <div class="card">
      <div id="substanceHeader"></div>
      <div id="substanceDetails" class="result-box"></div>
    </div>

    <div class="card">
      <label>🚛 Road Transport (NZS 5433)</label>
      <div id="roadRules"></div>
    </div>

    <div class="card">
      <label>🌊 Sea Transport (IMDG Code 7.2)</label>
      <div id="seaRules"></div>
    </div>
  </div>

  <script>
    const db = {
      "1203": { name: "MOTOR SPIRIT / GASOLINE / PETROL", class: "3", sub: "", pg: "II", sgg: "None", marine: "Segregation code 1 away from Class 1, 5.1, 5.2. Prohibited with Class 2.1 in same freight container without barrier." },
      "1830": { name: "SULPHURIC ACID with >51% acid", class: "8", sub: "", pg: "II", sgg: "SGG1 (Acids)", marine: "Segregation code 2 (Separated from) Class 4.3, 5.1. Strictly segregated from SGG18 (Alkalis) and Class 7." },
      "1950": { name: "AEROSOLS, flammable", class: "2.1", sub: "", pg: "N/A", sgg: "None", marine: "Code 1 (Away from) Class 1 (except 1.4S), Class 7. Segregate from heat sources." },
      "1005": { name: "AMMONIA, ANHYDROUS", class: "2.3", sub: "8", pg: "N/A", sgg: "SGG18 (Alkalis)", marine: "Code 2 (Separated from) Class 3, 4, 5, and SGG1 (Acids). Must not be loaded with food cargo." },
      "1719": { name: "CAUSTIC ALKALI LIQUID, N.O.S.", class: "8", sub: "", pg: "II", sgg: "SGG18 (Alkalis)", marine: "Code 2 (Separated from) SGG1 (Acids). Incompatible with aluminum and zinc." },
      "1428": { name: "SODIUM", class: "4.3", sub: "", pg: "I", sgg: "None", marine: "Code 2/3 against water solutions, acids, and flammable liquids. Kept dry at all times." }
    };

    function quickFill(un) {
      document.getElementById('unInput').value = un;
      lookupDG();
    }

    function lookupDG() {
      const val = document.getElementById('unInput').value.trim();
      const item = db[val];
      const out = document.getElementById('output');

      if (!item) {
        alert("UN " + val + " not in preloaded demo list. Try 1203, 1830, 1950, 1005, 1719, or 1428.");
        return;
      }

      document.getElementById('substanceHeader').innerHTML = `
        <h2 style="margin:0; font-size:1.1rem; color:#fff;">UN ${val} - ${item.name}</h2>
        <div style="margin-top:6px;">
          <span class="badge badge-class">Class ${item.class}</span>
          ${item.sub ? `<span class="badge badge-sub">Sub-Risk ${item.sub}</span>` : ''}
          <span style="font-size:0.8rem; color:#94a3b8; margin-left:8px;">PG: ${item.pg} | SGG: ${item.sgg}</span>
        </div>
      `;

      let roadTxt = "";
      if (item.class === "3") {
        roadTxt = `
          <div class="rule-item"><span class="tag-prohibited">PROHIBITED:</span> Do not load with Class 1 (Explosives) or Class 5.1/5.2 (Oxidizers/Peroxides).</div>
          <div class="rule-item"><span class="tag-sep">SEPARATION:</span> Maintain minimum 3m separation or use an approved Segregation Device (SD) against Class 2.3 and Class 8 liquids.</div>
          <div class="rule-item"><span class="tag-allowed">ALLOWED:</span> Compatible with general freight, Class 9, and non-DG dry goods.</div>
        `;
      } else if (item.class === "8") {
        roadTxt = `
          <div class="rule-item"><span class="tag-prohibited">CRITICAL:</span> Do not co-load SGG1 Acids with SGG18 Alkalis or Cyanides in the same load compartment without containment.</div>
          <div class="rule-item"><span class="tag-sep">SEPARATION:</span> Maintain 3m separation from Class 4.3 (Dangerous When Wet) and Class 5.1.</div>
          <div class="rule-item"><span class="tag-allowed">FOOD SAFETY:</span> Must not be loaded above or adjacent to food packaging.</div>
        `;
      } else {
        roadTxt = `<div class="rule-item"><span class="tag-sep">STANDARD:</span> Segregate by 3m or approved segregation partition from incompatible hazard classes per NZS 5433 Table 6.</div>`;
      }

      document.getElementById('substanceDetails').innerHTML = `<strong>Segregation Group:</strong> ${item.sgg}<br><strong>Primary Hazards:</strong> Class ${item.class} ${item.sub ? '(Subsidiary ' + item.sub + ')' : ''}`;
      document.getElementById('roadRules').innerHTML = roadTxt;
      document.getElementById('seaRules').innerHTML = `
        <div class="rule-item"><span class="tag-sep">IMDG 7.2 RULE:</span> ${item.marine}</div>
        <div class="rule-item"><span class="tag-allowed">CONTAINER STOWAGE:</span> Must verify Bay/Row/Tier slot clearance before closing container manifest.</div>
      `;

      out.style.display = 'block';
      out.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
